<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display properties</title>
<style>
  * {margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

  html{background-color: #f1b8b8;}
 body {
  background-color: #fffdfd;
  font-family: Arial, sans-serif;
  border: .2px solid #000;
  height: 3000px;
  width: 960px;
}
.container div{     
  display: inline;
  width: 100px;
  height: 80px;
  background-color: aqua;
}
a{
  width: 500px;
  height: 50px;
  background-color: red;
  display: inline-block;
}
</style>
</head>

<body>
  <div class="container">
    <a href="#">dfdfdfdg</a>
      <div>DIV 1
      
    </div>    
    <div>DIV 2</div>
    <div>DIV 3</div>
    <div>DIV 4</div>
  </div>


</body>
</html>
