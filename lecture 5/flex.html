<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding-bottom: 1000px;
      background-color: rgb(247, 210, 162);
    }

    .container {
      
  position: relative;
  top: 20px;
  left: 30px;
  right: 80px;

      background-color: aqua;
      display: flex;
      justify-content: center;
         height: 300px;
      align-items: center;
    }

    .container div{
      background-color: rgb(56, 203, 135);
      height: 100px;
      width: 100px;
      border: 1px solid black;
      margin: 4px;
flex: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>DIV 1</div>
    <div>DIV 2</div>
    <div>DIV 3</div>
    <div>DIV 4</div>
  </div>
</body>

</html>
